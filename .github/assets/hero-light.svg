<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="tag"><rect x="80" y="180" width="0" height="40"><animate attributeName="width" from="0" to="760" begin="1.1s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
    <clipPath id="lines"><rect x="860" y="100" width="0" height="80"><animate attributeName="width" from="0" to="280" begin="1.4s" dur="1.6s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="320" fill="#faf8f3"/>
  <g stroke="#ebe6d9" stroke-width="1">
    <line x1="0" y1="64" x2="1200" y2="64"/><line x1="0" y1="112" x2="1200" y2="112"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="208" x2="1200" y2="208"/><line x1="0" y1="256" x2="1200" y2="256"/>
  </g>
  <rect x="74" y="92" width="0" height="58" rx="4" fill="#ffd84d" opacity="0.6">
    <animate attributeName="width" from="0" to="348" begin="0.3s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>
  <text x="80" y="138" font-size="68" font-weight="700" fill="#1c1a17" letter-spacing="-1">StudyMate</text>
  <g clip-path="url(#tag)">
    <text x="80" y="208" font-size="23" fill="#6b665c">Ask your PDFs. Get streamed answers with page-level citations.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6b665c">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
      <rect x="80" y="238" width="78" height="28" rx="14" fill="none" stroke="#ddd8cb"/><text x="119" y="256" text-anchor="middle">FastAPI</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/>
      <rect x="168" y="238" width="112" height="28" rx="14" fill="none" stroke="#ddd8cb"/><text x="224" y="256" text-anchor="middle">FAISS + BM25</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
      <rect x="290" y="238" width="92" height="28" rx="14" fill="none" stroke="#ddd8cb"/><text x="336" y="256" text-anchor="middle">Next.js 16</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
      <rect x="392" y="238" width="74" height="28" rx="14" fill="none" stroke="#ddd8cb"/><text x="429" y="256" text-anchor="middle">Gemini</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
      <rect x="476" y="238" width="60" height="28" rx="14" fill="none" stroke="#ddd8cb"/><text x="506" y="256" text-anchor="middle">SSE</text></g>
  </g>

  <!-- answer card -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <rect x="836" y="60" width="328" height="196" rx="12" fill="#ffffff" stroke="#ddd8cb"/>
    <circle cx="862" cy="84" r="4" fill="#f0a500"><animate attributeName="r" values="3;5;3" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="874" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b665c">streaming answer</text>
    <text x="1148" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b665c" text-anchor="end">chat/stream</text>
    <g clip-path="url(#lines)">
      <rect x="860" y="112" width="280" height="10" rx="5" fill="#e6e1d4"/>
      <rect x="860" y="134" width="248" height="10" rx="5" fill="#e6e1d4"/>
      <rect x="860" y="156" width="188" height="10" rx="5" fill="#e6e1d4"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
      <rect x="1056" y="151" width="30" height="20" rx="5" fill="#ffd84d"/>
      <text x="1071" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c1a17" text-anchor="middle">[1]</text>
    </g>
    <g opacity="0" transform="translate(0,8)">
      <animate attributeName="opacity" to="1" begin="3.3s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="3.3s" dur="0.4s" fill="freeze"/>
      <rect x="860" y="190" width="280" height="44" rx="8" fill="#faf8f3" stroke="#ddd8cb"/>
      <rect x="872" y="202" width="20" height="20" rx="4" fill="#ffd84d"/>
      <text x="882" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1c1a17" text-anchor="middle">1</text>
      <text x="902" y="210" font-size="12.5" font-weight="600" fill="#1c1a17">biology-notes.pdf</text>
      <text x="902" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b665c">page 3 · score 1.00</text>
    </g>
  </g>
</svg>
