name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["studyMate-frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["studyMate-frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: studyMate-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studyMate-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
