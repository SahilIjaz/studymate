name: Backend CI

on:
  push:
    branches: [main]
    paths: ["study-mate-backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["study-mate-backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: study-mate-backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: study-mate-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        env:
          EMBEDDING_PROVIDER: hashed
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./study-mate-backend
          push: false
          tags: studymate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
