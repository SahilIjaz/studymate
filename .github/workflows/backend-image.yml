name: Backend image

# Builds the API image for amd64 (laptops, Cloud Run) and arm64 (Oracle Ampere)
# and publishes it to GitHub Container Registry on every push to main.
on:
  push:
    branches: [main]
    paths:
      - "study-mate-backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sahilijaz/studymate-api
          tags: |
            type=raw,value=main
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: study-mate-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
