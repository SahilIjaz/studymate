apiVersion: apps/v1
kind: Deployment
metadata:
  name: studymate-api
  namespace: studymate
  labels:
    app: studymate-api
spec:
  # One replica: SQLite and the FAISS files live on a single RWO volume.
  # Scaling out means moving state to Postgres/pgvector first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: studymate-api
  template:
    metadata:
      labels:
        app: studymate-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: studymate-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: studymate-api-config
            - secretRef:
                name: studymate-api-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: studymate-data
