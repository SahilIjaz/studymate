# Let's Encrypt via cert-manager, HTTP-01 challenge served by Traefik.
# Requires cert-manager to be installed first (see deploy/k3s/bootstrap.sh).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hssahil2913@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
