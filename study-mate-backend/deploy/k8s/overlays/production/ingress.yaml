# Public HTTPS entry point: https://study-mate-ai.duckdns.org
# Traefik (bundled with k3s) terminates TLS with a cert-manager certificate.
# Traefik does not buffer responses by default, so SSE streaming works as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studymate-api
  namespace: studymate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - study-mate-ai.duckdns.org
      secretName: studymate-api-tls
  rules:
    - host: study-mate-ai.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studymate-api
                port:
                  name: http
