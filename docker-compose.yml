# Runs both halves of StudyMate together. From this directory:
#   GEMINI_API_KEY=... docker compose up --build
# Set ANTHROPIC_API_KEY instead to answer with Claude. Both keys are optional;
# with neither, set LLM_MOCK=true in study-mate-backend/.env for canned answers.
# Web: http://localhost:3000   API: http://localhost:8000/docs
services:
  api:
    build: ./study-mate-backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      DATA_DIR: /data
    volumes:
      - studymate-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./studyMate-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  studymate-data:
